    Xəzri ölkədaxili sürətli köçürmə sistemidir — beynəlxalq ölkə siyahısı
    yoxdur (daxili köçürmələr saniyələr ərzində, minimal komissiya ilə).
    Beynəlxalq köçürmələr üçün Western Union (200+ ölkə) təklif olunur. Düzgün
    cavab Xəzrini daxili sistem kimi göstərməlidir.

