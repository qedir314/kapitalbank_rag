  category: money-transfers
  lang: ru
  expected_sources: ["cash-card-to-card", "pul-kocurmeleri"]
  reference_answer: >-
    Через банкоматы «Cash in Kapital Bank» (Cash to Card): достаточно ввести
    16-значный номер карты, на которую зачисляются средства — карта-получатель
    не нужна; средства зачисляются сразу.

- id: ru-transfers-003
  question: "В какой валюте преимущественно отправляются переводы Western Union и нужен ли для этого счёт в банке?"
  category: money-transfers
  lang: ru
  expected_sources: ["western-union", "pul-kocurmeleri"]
