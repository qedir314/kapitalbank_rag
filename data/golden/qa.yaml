- id: az-insurance-001
  question: "Optimal kasko sığortası hansı şirkətdəndir və qiyməti nə qədərdir?"
  category: insurance
  lang: az
  expected_sources: ["optimal-kasko"]
  reference_answer: >-
    PAŞA Sığorta şirkətinin Kapital Bank/Birbank müştəriləri üçün məhsuludur;
    sığorta haqqı: qeyri-rəsmi servis 250 AZN, rəsmi servis 300 AZN; şərtsiz
    azadolma 100 AZN.

- id: az-insurance-002
  question: "İşsizlik sığortası hansı hallarda və nə qədər ödəyir?"
  category: insurance
  lang: az
  expected_sources: ["issizlik"]
  reference_answer: >-
    Müəssisə ləğv edildikdə, iş yerləri ixtisar edildikdə və ya azaldıldıqda
    iş itirilərsə: maksimum 5 ay olmaqla, aylıq kredit kartı borcu üçün 200
    AZN-ə qədər ödənilir; ödəniş gecikmələrinə görə cərimə və dəbbə pulu
    ödənilmir.

- id: en-insurance-002
  question: "What does debit card physical-damage insurance cover and how many free replacements are there?"
  category: insurance
  lang: en
  expected_sources: ["debet-kartlarin-fiziki-zedelenmeden", "sigortalar"]
  reference_answer: >-
    Covers theft/robbery, ATM incidents, fire, natural disasters, deliberate
    third-party acts and loss; on damage or loss the card is replaced free of
    charge — 1-year cards once per insurance year, 3-year cards up to 3 times.

- id: ru-insurance-002
  question: "От чего защищает страхование фишинга и скимминга и при каком условии действует 3D Secure?"
  category: insurance
  lang: ru
  expected_sources: ["phishing-skimming"]
  reference_answer: >-
    Покрывает убытки от фишинговых атак и скимминга (кража данных карты через
    письма/SMS, считывание в банкоматах). Пластиковые карты подключены к
    «3D Secure»; если сервис по желанию клиента отключён, мошеннические
    операции в интернете уже не страхуются.

# =============================================================== faq (8) =====
- id: en-faq-001
  question: "How can I block my card if it is lost or stolen?"
  category: faq
  lang: en
  expected_sources: ["faq"]
  notes: "KB-boundary item: the FAQ pages contain PIN/account block and 3D Secure unblock, but NO lost-card blocking procedure"
  reference_answer: >-
    The KB FAQ does not contain a lost-card blocking procedure (it covers
    unblocking a card and unlocking 3D Secure). The correct answer says so
    honestly and directs the user to the Birbank app card settings and/or
    1911 — it must not invent steps.

- id: az-faq-001
  question: "Kartımı itirdimsə, necə bağlaya bilərəm?"
  category: faq
  lang: az
  expected_sources: ["faq"]
  notes: "KB-boundary item, same as en-faq-001"
  reference_answer: >-
    Kontekstdə itmiş kartın bloklanması üzrə addım-addım təlimat yoxdur (FAQ
    kartın blokdan çıxarılması və 3D Secure əməliyyatlarını əhatə edir). Düzgün
    cavab limiti etiraf edir və Birbank tətbiqinin kart bölməsinə / 1911-ə
    yönləndirir; uydurma addımlar yazmamalıdır.

- id: ru-faq-001
  question: "Что делать, если я потерял карту банка?"
  category: faq
  lang: ru
  expected_sources: ["faq"]
  notes: "KB-boundary item; card-damage insurance (free replacement on loss) is the adjacent documented fact"
  reference_answer: >-
    RU FAQ не описывает блокировку утерянной карты. Допустимый честный ответ:
    признание этого + связанная информация (страхование карт от физического
    повреждения покрывает случаи утраты с бесплатной заменой) + звонок 1911;
    выдуманные шаги блокировки недопустимы.

- id: az-faq-002
  question: "Kartıma qoşulmuş xidmətləri necə söndürə bilərəm?"
  category: faq
  lang: az
  expected_sources: ["faq"]
  reference_answer: >-
    Əsas səhifədən lazım olan kartı seçin, səhifəni yuxarı sürüşdürün, "Karta
    qoşulmuş sevislər" bölməsinə keçin — orada xidmətləri aktiv/deaktiv etmək
    olar.

- id: en-faq-002
  question: "How do I activate the 3D Secure service on my card?"
  category: faq
  lang: en
  expected_sources: ["faq"]
  reference_answer: >-
    On the main page select the card, scroll the opened page, select "3D
    Secure", enter the code and press "Activate" — then the service shows as
    "Active".

- id: en-faq-003
  question: "What should I do if I forgot my app password?"
  category: faq
  lang: en
  expected_sources: ["faq"]
  reference_answer: >-
    From the main menu open "Registration" (or "For users registered in
    BirBank") and the "Can't log in to the app?" section and follow the
    re-registration/recovery flow described there.

- id: ru-faq-002
  question: "Что произойдёт, если я три раза подряд введу неверный PIN-код?"
  category: faq
  lang: ru
  expected_sources: ["faq"]
  reference_answer: >-
    Счёт блокируется. Нужно позвонить в информационный центр 196, подтвердить
    личность — блокировка со счёта будет снята.

- id: az-faq-003
  question: "Kartla Birbank tətbiqinə necə qeydiyyatdan keçirəm?"
  category: faq
  lang: az
  expected_sources: ["faq"]
  reference_answer: >-
    "Birbank" tətbiqinə daxil olun → "Qeydiyyat" bölməsini seçin → qeydiyyat
    üsulunu seçin: SİMA ilə və ya mobil nömrə ilə; SİMA seçilərsə ekrandakı
    addımları tamamlayın.

