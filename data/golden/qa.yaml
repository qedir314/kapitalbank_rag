# ========================================================= insurance (6) =====
- id: en-insurance-001
  question: "Which insurance products can I get through Kapital Bank?"
  category: insurance
  lang: en
  expected_sources: ["sigortalar", "insurance"]
  reference_answer: >-
    Unemployment insurance (covers loan/card debt on job loss from
    liquidation/downsizing), Personal Accident Insurance on Capital Deposit
    (min 5,000 AZN deposit), Optimal Kasko (PAŞA Sığorta, 250–300 AZN
    premium), phishing–skimming fraud protection, and physical-damage
    insurance for credit/debit cards.

- id: ru-insurance-001
  question: "Какие страховые продукты предлагает Капитал Банк?"
  category: insurance
  lang: ru
  expected_sources: ["sigortalar", "insurance", "straxov"]
  reference_answer: >-
    Индивидуальная страховка от несчастных случаев (владельцы вкладов от 5 000
