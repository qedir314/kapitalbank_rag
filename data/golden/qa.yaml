# ============================================================ loans (9) ======
- id: en-loans-001
  question: "What loan products does Kapital Bank offer?"
  category: loans
  lang: en
  expected_sources: ["kreditler", "loans"]
  reference_answer: >-
    The KB documents at least: deposit-secured loan (low interest, minimal
    documentation — ID only; foreigners passport-only), micro-business loans
    (1,000–100,000 AZN, 6–36 months, unsecured option), and Personal/Birbank
    Private loans from 10.9% up to 50,000 AZN without guarantor/collateral. A
    complete answer may defer to kapitalbank.az/1911 for the full catalogue.

- id: az-loans-001
  question: "Nağd pul krediti üçün maksimal məbləğ nə qədərdir?"
  category: loans
  lang: az
  expected_sources: ["nagd-kredit", "kreditler"]
  notes: "KB does not state a maximum — honest limitation is the correct answer (stale-trap style question)"
  reference_answer: >-
    Kontekstdə nağd kredit üçün maksimal məbləğ göstərilmir. Düzgün cavab bunu
    etiraf edir və mövcud kampaniya faktını verir: kampaniya çərçivəsində hər
    6 000 AZN kreditə aylıq ödəniş 190 AZN; onlayn rəsmiləşdirmədə
    nağdlaşdırma komissiyası 0%; müraciətlər üçün 1911-ə yönləndirir.

- id: az-micro-001
  question: "Mikro biznes kreditləri hansı şərtlərlə verilir?"
  category: loans
  lang: az
  expected_sources: ["mikro-biznes", "mikrokredit"]
  reference_answer: >-
    Yaş 20-dən yuxarı, sahibkarlıq/peşə fəaliyyəti üzrə minimum 12 ay təcrübə,
    qeydiyyatdan keçmiş VÖEN, kredit tarixçəsinin qiymətləndirilməsi; məbləğ
    1 000–100 000 AZN, müddət 6–36 ay, illik faiz 16%-dən başlayır (girov və ya
    zaminlə daha aşağı); girovsuz/zaminsiz də rəsmiləşdirilə bilər.

- id: ru-loans-001
  question: "Можно ли получить кредит под залог депозита и на каких условиях?"
  category: loans
  lang: ru
  expected_sources: ["emanet-teminatli-kredit", "kreditler"]
  reference_answer: >-
    Да. Годовая ставка: депозиты в AZN +5%, в USD +4%. Не требуются справка о
    доходах, подтверждение занятости и места жительства — кредит оформляется
    на основании только депозитного счёта в Kapital Bank/Birbank.

- id: en-loans-002
  question: "Can I get a loan secured by my deposit at Kapital Bank?"
  category: loans
  lang: en
  expected_sources: ["emanet-teminatli-kredit", "kreditler"]
  reference_answer: >-
    Yes — deposit-secured loan: low interest, obtained quickly based solely on
    the deposit account; no income statement, employment or residence
    verification; foreign nationals can apply with a passport only (military
    personnel add a service ID to the national ID).

- id: en-loans-003
  question: "What are the amount and term limits for the micro business loan?"
  category: loans
  lang: en
  expected_sources: ["mikro-biznes", "mikro-kredit"]
  reference_answer: >-
    1,000–100,000 AZN, term 6–36 months; the concrete amount/term depends on
    business turnover and repayment capacity; from 16% annual (lower with
    collateral/guarantor); applicants need age 20+, 12 months business
    experience and a registered VÖEN.

- id: az-loans-002
  question: "Emanət təminatlı kreditin illik faiz dərəcəsi necə müəyyən edilir?"
  category: loans
  lang: az
  expected_sources: ["emanet-teminatli-kredit"]
  reference_answer: >-
    İllik faiz dərəcəsi depozitin valyutasından asılıdır: AZN depozitləri üzrə
    depozit dərəcəsinə +5%, USD depozitləri üzrə +4%. Gəlir hesabatı və ya
    əmək haqqı vəsiqəsi tələb olunmur — yalnız Kapital Bankdakı depozit
    hesabı kifayətdir.

- id: ru-loans-002
  question: "Каков максимальный лимит овердрафта для бизнеса и его годовая ставка?"
  category: loans
  lang: ru
  expected_sources: ["overdraft"]
  reference_answer: >-
    Максимальный лимит по скорингу — 100 000 AZN на срок 12 месяцев; годовая
    ставка овердрафта — 19% (на сумму до 25 000 AZN); в течение рабочего дня
    средствами можно пользоваться без процентов.

- id: en-loans-004
  question: "What monthly payment does the cash loan campaign quote for a 6,000 AZN loan, and when can the campaign terms be lost?"
  category: loans
  lang: en
  expected_sources: ["nagd-kredit"]
  reference_answer: >-
    The campaign quotes 190 AZN monthly per 6,000 AZN loan; online-arranged
    loans carry 0% cash-out commission. The campaign cannot be used if the sum
    of the client's loan payments exceeds 45% of official income (subsistence
    minimum not preserved); refinancing loans may be excluded per the fine
    print.

# ========================================================= deposits (8) ======
- id: en-deposits-001
  question: "What deposit products does Kapital Bank offer?"
  category: deposits
  lang: en
  expected_sources: ["deposits"]
  notes: "label kept — /en/deposits pages do exist; the old miss was rank-7 retrieval, not a bad label"
  reference_answer: >-
    For individuals: perpetual (demand) deposit — min 100 AZN/USD, funds
    withdrawable any time, interest paid at withdrawal, 12-month auto-renewal;
    deposit safe boxes; plus Personal Accident Insurance on Capital Deposit
    (from 5,000 AZN deposits). Businesses: Biznes Depozit (local/foreign
    currency, min 100 AZN/EUR/USD).

- id: az-deposits-001
  question: "Kapital Bankın depozit qutuları ilə bağlı şərtlər hansılardır?"
  category: deposits
  lang: az
  expected_sources: ["depozit-seyfleri"]
  reference_answer: >-
    Depozit seyfləri 3 aydan çox müddətə verilir; aylıq xidmət haqqı ölçüdən
    asılıdır: 30 AZN (10x40x45) — 75 AZN (60x40x45) aralığında, məsələn
    15x32x43 — 40 AZN, 25x40x45 — 55 AZN, 30x32x43 — 60 AZN.

- id: ru-deposits-001
  question: "Какие вклады предлагает Капитал Банк?"
  category: deposits
  lang: ru
  expected_sources: ["deposits", "vklady"]
  reference_answer: >-
    Бессрочный депозит: минимальная сумма 100 AZN/USD, снятие в любое время,
    проценты выплачиваются при снятии, минимальный срок 12 месяцев с
    автоматической пролонгацией; для юрлиц — бизнес-депозит (100 AZN/EUR/USD);
    также депозитные сейфы (30–75 AZN/мес. по размеру).

- id: en-deposits-002
  question: "What is the minimum amount of the perpetual (müddətsiz) deposit and when is interest paid?"
  category: deposits
  lang: en
  expected_sources: ["muddetsiz-depozit"]
  reference_answer: >-
    Minimum 100 AZN/USD; interest is paid when the deposit amount is withdrawn
    (not on a schedule); contracts run for a minimum of 12 months and renew
    automatically unless rates/terms change.

- id: az-deposits-002
  question: "Biznes depozit hesabını açmaq üçün hansı sənədlər tələb olunur və minimum məbləğ nə qədərdir?"
  category: deposits
  lang: az
  expected_sources: ["depozitler", "hesab-xidmetleri"]
  reference_answer: >-
    Hüquqi şəxsin Kapital Bankda depozit hesabının olması kifayətdir — əlavə
    sənəd tələb olunmur; minimum məbləğ 100 AZN/EUR/USD; vəsait yerli və xarici
    valyutada saxlanılır, bank əmanətlərin məxfiliyini təmin edir.

- id: ru-deposits-002
  question: "Сколько стоит депозитный сейф размером 60x40x45 см и на какой минимальный срок он сдаётся?"
  category: deposits
  lang: ru
  expected_sources: ["depozit-seyfleri"]
  reference_answer: >-
    60 см x 40 см x 45 см — 75 AZN в месяц; минимальный срок хранения — от 3
    месяцев.

- id: en-deposits-003
  question: "What insurance comes with a capital deposit of at least 5,000 AZN?"
  category: deposits
  lang: en
  expected_sources: ["ferdi-qeza-sigortasi", "deposits"]
  reference_answer: >-
    Personal Accident Insurance on Capital Deposit: opens together with a
    deposit of minimum 5,000 AZN (in AZN), valid one year; covers death and
    disability grades I–III from accident or illness (100% of the insured
    amount for death/Grade I).

- id: mt-ru-deposits-001
  question: "А какая минимальная сумма для него?"
  category: deposits
  lang: ru
  history:
    - role: user
      content: "Что такое бессрочный депозит в Капитал Банке?"
    - role: assistant
      content: "Бессрочный депозит — вклад без ограничения по сроку: средства можно снимать в любое время, проценты выплачиваются при снятии."
  expected_sources: ["muddetsiz-depozit", "deposits"]
  reference_answer: >-
    (Coreference: «него» = бессрочный депозит.) Минимальная сумма — 100
    AZN/USD.

