# ========================================================== birbank (4) ======
- id: en-birbank-001
  question: "What is Birbank?"
  category: birbank
  lang: en
  expected_sources: ["about-us", "birbank"]
  reference_answer: >-
    Since 2025 Kapital Bank provides customer services under the Birbank brand
    (also a mobile app and birbank.az); Kapital Bank continues as the
    financial institution and corporate brand — Birbank is the service brand.

- id: az-birbank-001
  question: "Birbank brendi nə vaxtdan fəaliyyət göstərir və Kapital Bankla əlaqəsi nədir?"
  category: birbank
  lang: az
  expected_sources: ["about-us"]
  reference_answer: >-
    2025-ci ildən: bank uzun illər Kapital Bank adı ilə (Azərbaycan Yığılma
    Bankının varisi kimi) fəaliyyət göstərib; hazırda Kapital Bank maliyyə
    kurumu və korporativ brend kimi davam edir, Birbank isə müştəri
    xidmətlərinin əsas brendidir.

- id: ru-birbank-001
  question: "Каким банком-предшественником является Kapital Bank и под каким брендом работает с 2025 года?"
  category: birbank
  lang: ru
  expected_sources: ["about-us"]
  reference_answer: >-
    Kapital Bank — преемник Azerbaijan Deposit Bank (Азербайджанского
    Сберегательного Банка); с 2025 года услуги населению оказываются под
    брендом Birbank.

- id: en-birbank-002
  question: "What is the relationship between the Kapital Bank corporate brand and the Birbank customer brand today?"
  category: birbank
  lang: en
  expected_sources: ["about-us"]
  reference_answer: >-
    They are the same bank: Kapital Bank continues as the legal/financial
    institution and corporate brand, while Birbank is the customer-facing
    service brand (app + website) used since 2025.

