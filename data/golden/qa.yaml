# Golden QA set for RAG evaluation (Phase 3 expansion: 30 -> ~70 questions).
#
# expected_sources are URL fragments — a retrieval counts as a hit when any
# returned URL contains one of them (case-insensitive substring match).
# unanswerable: true => the correct behavior is an explicit refusal.
# reference_answer: ground truth the judge scores correctness against. Written
# by verifying the cited corpus pages (data/raw/pages.jsonl), not copied from
# generator output.
# history: prior chat turns for multi-turn items (runner feeds them to the
# pipeline to test coreference handling).
# notes: provenance for reviewers (label fixes, deliberate KB-boundary items).
#
# Validate after any re-scrape:  python -m scripts.validate_golden_set

# ============================================================ cards (12) =====
- id: en-cards-001
  question: "What is the Birbank Miles debit card and what are its main features?"
  category: cards
  lang: en
  expected_sources: ["debet-kartlar"]
  reference_answer: >-
    Birbank Miles Debit is a debit card whose transactions earn miles that can
    be redeemed for airline tickets with any airline; the card is free and
    comes with bonuses from partner merchants.

- id: en-cards-002
  question: "Which premium cards does Kapital Bank offer?"
  category: cards
  lang: en
  expected_sources: ["private.birbank.az", "debet-kartlar"]
  reference_answer: >-
    Premium tier: Birbank Platinum and Birbank Platinum Miles (premium
    privileges + continuous bonuses), Birbank Visa Infinite Cashback and Visa
    Infinite Miles (VIP status), Mastercard World Elite Miles; Birbank Private
    adds private-banking VIP services (individual loans up to 50,000 AZN from
    10.9%).

- id: az-cards-001
  question: "Kapital Bankın taksit kartları hansılardır?"
  category: cards
  lang: az
  expected_sources: ["debet-kartlar", "taksit"]
  notes: "label fix (Phase 3): old fragment 'taksitkartlar' matches no URL; real installment pages carry 'taksit'"
  reference_answer: >-
    Taksit (installment) kart ailəsi: BirKart Red, BirKart Black, BirKart
    Umico, BirKart Miles — 0% faiz, 63 günədək güzəşt dövrü və 'taksit
    kartları' kimi istifadə; üstəgəl Birbank Umico Premium Taksit Kartı
    (Kapital Bank + Umico birgə məhsulu, gündəlik alış-verişlərdən keşbek).

- id: az-cards-002
  question: "Birbank Cashback debet kartı hansı imkanları verir?"
  category: cards
  lang: az
  expected_sources: ["debet-kartlar"]
  reference_answer: >-
    DİQQƏT: 'Birbank Cashback' debet deyil, taksit (installment) kartıdır;
    debet siyahısında Cashback adına yalnız 'Birbank Visa Infinite Cashback'
