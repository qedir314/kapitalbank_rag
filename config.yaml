scraper:
  sitemap_url:
    - https://www.kapitalbank.az/sitemap.xml   # legacy site (mostly 301s to birbank)
    - https://birbank.az/sitemap.xml           # consolidated product/service pages
    - https://birbank.business/sitemap.xml     # SME / business banking
  user_agent: "KapitalRAG-Bot/0.1 (educational RAG project)"
  request_delay_sec: 0.5
  timeout_sec: 20
  retries: 2
  min_text_chars: 300        # skip near-empty / JS-shell pages
  # application widgets / order forms — interactive, no knowledge content;
  # */success pages are post-submission screens
  exclude_url_patterns: ["ccl.birbank.az", "/success"]

embedding:
  # multilingual e5 covers az/ru/en; BAAI/bge-m3 has better multilingual support and 8k context
  model_name: BAAI/bge-m3
  batch_size: 32
  max_seq_tokens: 1024       # bge-m3 supports up to 8192, but chunks are ~800 chars

chunking:
  target_chars: 800          # sliding-window size per section
  overlap_chars: 120
  min_chars: 200             # drop tiny chunks before embedding

vector_store:
  persist_dir: data/chroma
  collection: kapital_kb
  distance: cosine

retrieval:
  top_k: 6
  # marketing/news pages dominate the corpus and pollute product queries;
  # excluded unless the caller explicitly filters on sections
  exclude_sections: ["news"]
  # hybrid search: dense vectors catch paraphrases, BM25 catches exact tokens
  # (product names, rates); RRF fuses the rankings, then a multilingual
  # cross-encoder re-scores the fused pool. First query downloads ~2 GB;
  # CPU cost per query is roughly proportional to rerank_candidates × length²
  candidate_pool: 60
  enable_bm25: true
  rerank_model: BAAI/bge-reranker-v2-m3
  rerank_candidates: 20
  rerank_max_length: 320
  # LLM query expansion (plan 2.2): rewrite the question into az/en/ru,
  # retrieve per variant, fuse by RRF. Re-measured OFF at 90.6% vs 92.2%
  # control on the corrected 76-Q instrument (+ reproduced refusal damage) —
  # rejected; see docs/hybrid_retrieval.md errata
  query_expansion: false
  # additive Cyrillic→Latin transliteration + one-step Azerbaijani suffix
  # stripping for BM25 tokens (plan 2.3) — re-measured 90.6% vs 92.2%
  # control, one flip out; rejected on the corrected instrument too
  morph_tokens: false
  # conversational query condensing (plan 4.4): fold a follow-up + chat
  # history into one standalone retrieval query (one extra LLM call, and only
  # when there is history — single-turn queries pay nothing). ADOPTED: the
  # multi-turn A/B flipped two deterministic retrieval misses (mt-ru-loans-001
  # rank 7→1, mt-en-insurance-001 miss→rank 3) with zero regressions;
  # control config + numbers in docs/hybrid_retrieval.md
  query_condensing: true

llm:
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 1024
  judge_model: deepseek-chat # LLM-as-judge; swappable to avoid self-judge bias

app:
  history_turns: 6           # conversation turns sent back as context
  # re-check every [n] marker against its passage after each answer and warn
  # in the UI about ones that don't line up (plan 4.2) — deterministic string
  # statistics, no API call, zero latency
  verify_citations: true
